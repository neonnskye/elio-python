<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="stream-window">
        <img src="/stream" id="stream-img" />
      </div>
      <div class="enroll-form">
        <input
          type="text"
          id="name-input"
          placeholder="Name"
          autocomplete="off"
        />
        <button id="enroll-btn">Enroll</button>
        <span id="status-msg"></span>
      </div>
      <div class="controls-row">
        <button id="mute-btn" class="unmuted" aria-label="Mute speaker">
          <span class="mute-icon">🔊</span>
          <span class="mute-label">Mute Speaker</span>
        </button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
