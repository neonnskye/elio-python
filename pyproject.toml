[project]
name = "elio-python"
version = "0.1.0"
description = "Elio Python backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-edge-litert>=2.1.6",
    "deptry>=0.25.1",
    "flask>=3.1.3",
    "groq>=1.4.0",
    "numpy>=2.4.6",
    "openai>=2.38.0",
    "opencv-python>=4.13.0.92; platform_system == 'Windows'",
    "openmeteo-requests>=1.7.5",
    "paho-mqtt>=2.1.0",
    "piper-tts>=1.4.2",
    "requests-cache>=1.3.2",
    "retry-requests>=2.0.0",
    "scipy>=1.17.1",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.5",
    "torch>=2.12.0",
    "zeroconf>=0.149.16",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
